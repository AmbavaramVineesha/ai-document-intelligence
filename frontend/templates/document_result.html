<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Extraction Result — DocIntel AI</title>
  <meta name="description" content="View extracted fields, financial validations and raw JSON for a processed document.">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <i class="fa-solid fa-brain-circuit"></i>
      <span>DocIntel AI Platform</span>
    </div>
    <div class="nav-links">
      <a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
      <a href="#" id="rawApiLink" target="_blank"><i class="fa-solid fa-code"></i> Raw API Response</a>
    </div>
  </header>

  <div class="container" id="mainContent">
    <div class="glass-card" style="text-align: center; padding: 4rem 2rem;">
      <div class="spinner" style="width: 40px; height: 40px; margin: 0 auto 1rem;"></div>
      <p style="color: var(--text-muted);">Loading document result…</p>
    </div>
  </div>

  <script src="../static/js/config.js"></script>
  <script>
    const API = CONFIG.API_BASE_URL;

    // ── Read document name from query string ─────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const docName = params.get('name');
    const mainContent = document.getElementById('mainContent');

    document.getElementById('rawApiLink').href = docName
      ? `${API}/api/v1/documents/${encodeURIComponent(docName)}`
      : `${API}/docs`;

    if (!docName) {
      showNotFound('No document name provided in URL.');
    } else {
      fetchAndRender(docName);
    }

    async function fetchAndRender(name) {
      try {
        const response = await fetch(`${API}/api/v1/documents/${encodeURIComponent(name)}`);
        if (response.status === 404) { showNotFound(name); return; }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderResult(data);
      } catch (err) {
        mainContent.innerHTML = `
          <div class="glass-card" style="text-align:center;padding:3rem 2rem;">
            <i class="fa-solid fa-circle-exclamation" style="font-size:3rem;color:var(--fail-red);margin-bottom:1rem;"></i>
            <h2>Failed to load document</h2>
            <p style="color:var(--text-muted);margin-top:0.5rem;">${err.message}</p>
            <a href="dashboard.html" class="btn-secondary" style="display:inline-block;margin-top:1.5rem;">Return to Dashboard</a>
          </div>`;
      }
    }

    function showNotFound(name) {
      mainContent.innerHTML = `
        <div class="glass-card" style="text-align:center;padding:4rem 2rem;">
          <i class="fa-solid fa-file-circle-xmark" style="font-size:4rem;color:var(--fail-red);margin-bottom:1rem;"></i>
          <h2 style="font-size:1.8rem;">Document Not Found</h2>
          <p style="color:var(--text-muted);margin-top:0.5rem;">No record found for "${escHtml(name)}".</p>
          <a href="dashboard.html" class="btn-secondary" style="display:inline-block;margin-top:1.5rem;">Return to Dashboard</a>
        </div>`;
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderResult(data) {
      document.title = `${data.document_name} — DocIntel AI`;

      const fv = data.file_validation || {};
      const meta = data.processing_metadata || {};
      const val = data.validation || {};
      const ext = data.extracted_data || {};

      // ── Status badge ────────────────────────────────────────────────────────
      const overallBadge = data.processing_status === 'PASS'
        ? `<span class="badge badge-pass" style="font-size:1rem;padding:0.5rem 1rem;"><i class="fa-solid fa-circle-check"></i> OVERALL PASS</span>`
        : `<span class="badge badge-fail" style="font-size:1rem;padding:0.5rem 1rem;"><i class="fa-solid fa-circle-xmark"></i> OVERALL FAILED</span>`;

      const confBadge = data.overall_confidence
        ? `<div style="background:rgba(6,182,212,0.15);border:1px solid var(--accent-cyan);padding:0.4rem 0.8rem;border-radius:0.5rem;font-weight:700;color:var(--accent-cyan);font-size:0.9rem;">Confidence: ${Math.round(data.overall_confidence * 100)}%</div>`
        : '';

      // ── File validation pills ───────────────────────────────────────────────
      const fvStatus = fv.status === 'PASS'
        ? `<span class="badge badge-pass">PASS</span>`
        : `<span class="badge badge-fail">FAILED</span>`;

      // ── Validation checks table ─────────────────────────────────────────────
      const checks = val.checks || [];
      const checksHtml = checks.length === 0
        ? `<p style="color:var(--text-muted);">No financial validation rules executed for this document.</p>`
        : `<div style="overflow-x:auto;"><table class="custom-table">
            <thead><tr><th>Check Name</th><th>Formula</th><th>Calculated</th><th>Reported</th><th>Variance</th><th>Status</th></tr></thead>
            <tbody>
              ${checks.map(c => {
                const st = c.status === 'PASS'
                  ? `<span class="badge badge-pass"><i class="fa-solid fa-check"></i> PASS</span>`
                  : c.status === 'FAIL' || c.status === 'FAILED'
                    ? `<span class="badge badge-fail"><i class="fa-solid fa-xmark"></i> FAIL</span>`
                    : `<span class="badge badge-na">N/A</span>`;
                return `<tr>
                  <td><strong>${escHtml(c.name)}</strong>${c.details ? `<br><small style="color:var(--text-muted);">${escHtml(c.details)}</small>` : ''}</td>
                  <td><code>${escHtml(c.formula)}</code></td>
                  <td>${c.calculated_value != null ? c.calculated_value : 'N/A'}</td>
                  <td>${c.reported_value != null ? c.reported_value : 'N/A'}</td>
                  <td>${c.variance != null ? c.variance : 'N/A'}</td>
                  <td>${st}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table></div>`;

      const issues = val.issues || [];
      const issuesHtml = issues.length > 0
        ? `<div style="margin-top:1rem;padding:1rem;background:rgba(239,68,68,0.1);border:1px solid var(--fail-red);border-radius:0.5rem;color:#fca5a5;">
            <strong>Validation Issues Identified:</strong>
            <ul style="margin-left:1.5rem;margin-top:0.5rem;">${issues.map(i => `<li>${escHtml(i)}</li>`).join('')}</ul>
           </div>`
        : '';

      // ── Extracted KV fields ─────────────────────────────────────────────────
      const skipKeys = ['line_items', 'statement_line_items'];
      const kvHtml = Object.entries(ext)
        .filter(([k]) => !skipKeys.includes(k))
        .map(([key, field]) => {
          let valDisplay;
          if (field && typeof field === 'object' && 'value' in field) {
            valDisplay = field.value != null
              ? `<div class="kv-value">${escHtml(String(field.value))}</div>`
              : `<div class="kv-value"><span style="color:var(--text-muted);font-style:italic;">null</span></div>`;
          } else {
            valDisplay = `<div class="kv-value">${escHtml(String(field ?? ''))}</div>`;
          }

          const evidence = (field && field.evidence && field.evidence.source_text)
            ? `<div class="kv-meta"><i class="fa-solid fa-quote-left"></i> "${escHtml(field.evidence.source_text)}" (Page ${field.evidence.page_number || 1})</div>`
            : '';

          const conf = (field && field.confidence)
            ? `<div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.25rem;">Confidence: ${Math.round(field.confidence * 100)}%</div>`
            : '';

          return `<div class="kv-item">
            <div class="kv-label">${escHtml(key.replace(/_/g, ' '))}</div>
            ${valDisplay}${conf}${evidence}
          </div>`;
        }).join('');

      // ── Line items table ────────────────────────────────────────────────────
      const lineItems = ext.line_items || [];
      const lineItemsHtml = lineItems.length > 0
        ? `<div class="glass-card">
            <div class="card-title"><i class="fa-solid fa-table-list" style="color:var(--accent-purple);"></i> Invoice Line Items Table</div>
            <div style="overflow-x:auto;"><table class="custom-table">
              <thead><tr><th>Description</th><th>Quantity</th><th>Unit Price</th><th>Amount</th></tr></thead>
              <tbody>
                ${lineItems.map(item => `<tr>
                  <td>${escHtml(item.description)}</td>
                  <td>${item.quantity ?? '-'}</td>
                  <td>${item.unit_price ?? '-'}</td>
                  <td><strong>${item.amount ?? '-'}</strong></td>
                </tr>`).join('')}
              </tbody>
            </table></div>
          </div>`
        : '';

      // ── Statement line items ────────────────────────────────────────────────
      const stmtItems = ext.statement_line_items || [];
      const stmtItemsHtml = stmtItems.length > 0
        ? `<div class="glass-card">
            <div class="card-title"><i class="fa-solid fa-table-cells" style="color:var(--accent-cyan);"></i> Financial Statement Line Items Table</div>
            <div style="overflow-x:auto;"><table class="custom-table">
              <thead><tr><th>Line Item Description</th><th>Current Period Value</th><th>Previous Period Value</th></tr></thead>
              <tbody>
                ${stmtItems.map(item => `<tr>
                  <td>${escHtml(item.description)}</td>
                  <td><strong>${item.current_period_value ?? '-'}</strong></td>
                  <td>${item.previous_period_value ?? '-'}</td>
                </tr>`).join('')}
              </tbody>
            </table></div>
          </div>`
        : '';

      // ── Assemble full page ──────────────────────────────────────────────────
      mainContent.innerHTML = `

        <!-- Summary Card -->
        <div class="glass-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:1rem;">
            <div>
              <h1 style="font-family:'Outfit';font-size:1.8rem;display:flex;align-items:center;gap:0.75rem;">
                <i class="fa-solid fa-file-contract" style="color:var(--accent-cyan);"></i>
                ${escHtml(data.document_name)}
              </h1>
              <p style="color:var(--text-muted);font-size:0.9rem;margin-top:0.25rem;">
                Category: <strong style="color:#fff;text-transform:uppercase;">${escHtml(data.document_type)}</strong>
                &nbsp;|&nbsp; Processed at: ${escHtml(meta.processed_at || '')} (${meta.processing_time_ms || 0} ms)
              </p>
            </div>
            <div style="display:flex;gap:0.75rem;align-items:center;">
              ${overallBadge}
              ${confBadge}
            </div>
          </div>

          <!-- File validation pills -->
          <div style="margin-top:1.5rem;padding:1rem;background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:0.5rem;display:flex;gap:1.5rem;flex-wrap:wrap;">
            <div><strong>File Type:</strong> ${escHtml(fv.file_type || 'N/A')}</div>
            <div><strong>Supported:</strong> ${fv.is_supported ? 'Yes' : 'No'}</div>
            <div><strong>Readable:</strong> ${fv.is_readable ? 'Yes' : 'No'}</div>
            <div><strong>Page Count:</strong> ${fv.page_count ?? 'N/A'} / 3 pages</div>
            <div><strong>Input Validation Status:</strong> ${fvStatus}</div>
            ${meta.ocr_used ? '<div><strong>OCR Used:</strong> Yes</div>' : ''}
          </div>
        </div>

        <!-- Financial Validation Checks -->
        <div class="glass-card">
          <div class="card-title">
            <i class="fa-solid fa-calculator" style="color:var(--accent-purple);"></i>
            Financial Calculation Validation Checks
          </div>
          ${checksHtml}
          ${issuesHtml}
        </div>

        <!-- Extracted KV Fields -->
        <div class="glass-card">
          <div class="card-title">
            <i class="fa-solid fa-key" style="color:var(--accent-cyan);"></i>
            Extracted Key-Value Fields &amp; Grounding Evidence
          </div>
          <div class="kv-grid">${kvHtml || '<p style="color:var(--text-muted);">No key-value fields extracted.</p>'}</div>
        </div>

        ${lineItemsHtml}
        ${stmtItemsHtml}

        <!-- Raw JSON View -->
        <div class="glass-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
            <div class="card-title" style="margin-bottom:0;">
              <i class="fa-solid fa-code" style="color:var(--accent-cyan);"></i>
              Raw Structured JSON Output
            </div>
            <button id="copyJsonBtn" class="btn-secondary">
              <i class="fa-solid fa-copy"></i> Copy JSON
            </button>
          </div>
          <pre class="json-view" id="jsonBlock">${escHtml(JSON.stringify(data, null, 2))}</pre>
        </div>
      `;

      // Copy JSON button
      document.getElementById('copyJsonBtn')?.addEventListener('click', () => {
        navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
          alert('JSON copied to clipboard!');
        });
      });
    }
  </script>
</body>
</html>
