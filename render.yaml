services:
  # ── Backend: FastAPI REST API ────────────────────────────────────────────
  - type: web
    name: docintel-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:///./document_intelligence.db
      - key: GEMINI_API_KEY
        sync: false   # Set this manually in the Render dashboard
      - key: FRONTEND_URL
        sync: false   # Set to your Vercel frontend URL, e.g. https://docintel.vercel.app
